<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind — Join the waitlist</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; color: #1a1a1a; background: #f7f7f5; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 24px; text-align: center; }
  h1 { font-size: 40px; margin: 0 0 16px; }
  p.lede { font-size: 18px; color: #555; margin: 0 0 32px; line-height: 1.6; }
  form { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  input[type="email"] { font-size: 16px; padding: 12px 16px; border: 1px solid #ccc; border-radius: 8px; width: 280px; }
  button { font-size: 16px; padding: 12px 24px; border: none; border-radius: 8px; background: #1a1a1a; color: #fff; cursor: pointer; }
  #confirm { display: none; margin-top: 24px; padding: 16px; background: #e6f4ea; border-radius: 8px; color: #137333; line-height: 1.6; }
  footer { margin-top: 64px; color: #999; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Northwind</h1>
  <p class="lede">A quiet place to read the news. Join the waitlist and we will let you know when it opens.</p>
  <form id="signup">
    <input type="email" id="email" placeholder="you@example.com" required>
    <button type="submit">Join the waitlist</button>
  </form>
  <div id="confirm"></div>
  <footer>Northwind &middot; Built as a one-page landing page with a signup form and email confirmation.</footer>
</main>
<script>
  document.getElementById("signup").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value;
    var box = document.getElementById("confirm");
    box.textContent = "Thanks! Please check your inbox — a confirmation email is on its way to " + email + ".";
    box.style.display = "block";
  });
</script>
</body>
</html>
